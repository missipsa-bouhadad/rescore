services:
  postgres:
    image: postgres:18-alpine
    container_name: rescore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Catches emails sent (in dev)
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: rescore-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
