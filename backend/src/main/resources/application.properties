spring.application.name=backend

# Read db credentials from .env
spring.config.import=optional:file:../.env[.properties]

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate only checks tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors as JSON with a readable message
spring.mvc.problemdetails.enabled=true

# SMTP server that receives our emails (Mailpit in dev)
spring.mail.host=localhost
spring.mail.port=1025
app.mail-from=ReScore <no-reply@rescore.local>

# Front address (used in email links)
app.front-url=http://localhost:5173
