    <!-- Student residence with a graduation cap -->
    <g id="residence">
      <!-- Outline like the reference: pitched roof, small eaves, walls -->
      <path d="M16 13 L2.5 26.5 H5.5 V59.5 H26.5 V26.5 H29.5 Z" fill="white" stroke="#059669" stroke-width="3" stroke-linejoin="round"/>
      <!-- Window with a cross -->
      <rect x="13" y="26" width="6" height="6" fill="none" stroke="#059669" stroke-width="1.5"/>
      <path d="M16 26 V32 M13 29 H19" stroke="#059669" stroke-width="1"/>
      <!-- Door -->
      <rect x="11.5" y="44" width="9" height="15.5" fill="#059669"/>
      <!-- Cap: tilted, its base on the roof top, the rest in the air -->
      <g transform="translate(32 3) scale(-1 1)">
        <g transform="rotate(20 17 10)">
          <polygon points="5,6 17,1.5 29,6 17,10.5" fill="#0f172a"/>
          <rect x="11" y="7" width="12" height="5" fill="#0f172a"/>
        </g>
        <!-- Tassel hangs straight down from the board corner -->
        <polyline points="18.4,6.2 29.6,10.3 29.6,15" fill="none" stroke="#f59e0b" stroke-width="1"/>
        <path d="M29.6 14 L31 18.5 H28.2 Z" fill="#f59e0b"/>
      </g>
    </g>
  </defs>
  <!-- Left residence -->
  <use href="#residence"/>
  <!-- Right residence is a mirror copy -->
  <use href="#residence" transform="translate(64 0) scale(-1 1)"/>
  <!-- Left boy: blue shirt, blond hair -->
  <use href="#boy" x="11.4" y="35" width="9.3" height="24" style="--shirt:#2563eb; --hair:#f1a11e"/>
  <!-- Right boy: red shirt, brown hair -->
  <use href="#boy" x="43.3" y="35" width="9.3" height="24" style="--shirt:#dc2626; --hair:#6b3e1f"/>
  <!-- VS badge in the middle -->
  <circle cx="32" cy="44" r="7" fill="#f59e0b" stroke="white" stroke-width="2"/>
  <text x="32" y="46.8" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="white" text-anchor="middle">VS</text>
</svg>
